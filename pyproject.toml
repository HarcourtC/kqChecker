[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["kq", "cas_token"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "E", "F", "W", "C", "B", "I", "ANN",
]
extend-ignore = ["E203","E501","C901"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
